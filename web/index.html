<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RoomTime: video rooms you join by code.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RoomTime">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <title>RoomTime</title>
  <link rel="manifest" href="manifest.json">

  <!-- Dark preloader: no white frame while Flutter loads. Flutter's first
       frame covers it; the spinner is the #00AEFF of the app. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #preloader {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; background: #000;
    }
    #preloader div {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: #00AEFF;
      animation: preloader-spin 0.9s linear infinite;
    }
    @keyframes preloader-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #preloader div { animation: none; }
    }
  </style>
</head>
<body>
  <div id="preloader" aria-busy="true" aria-label="Loading RoomTime"><div></div></div>
  <!-- Same-origin script (the edge CSP allows script-src 'self' only). -->
  <script src="preloader.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
