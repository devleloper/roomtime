name: Release

# Runs only for SemVer tags. Builds the Flutter web bundle as a workflow artifact with build
# provenance. No app store uploads, no deployment.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release half-way

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag is SemVer and matches pubspec.yaml
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          version="${tag#v}"
          pubspec="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          if [ "$version" != "$pubspec" ]; then
            echo "::error file=pubspec.yaml::Tag $tag does not match pubspec version $pubspec"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false # release builds start from a clean SDK and pub cache

      - name: flutter build web
        # No dart-define: an empty API_BASE_URL makes the web app use the origin that serves it.
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --no-web-resources-cdn

      - name: Package
        run: |
          tar -C build/web -czf "roomtime-web-${VERSION}.tar.gz" .
          sha256sum "roomtime-web-${VERSION}.tar.gz" > "roomtime-web-${VERSION}.tar.gz.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: roomtime-web-${{ env.VERSION }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roomtime-web-${{ env.VERSION }}
          path: |
            roomtime-web-${{ env.VERSION }}.tar.gz
            roomtime-web-${{ env.VERSION }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
