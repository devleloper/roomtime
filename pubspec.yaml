name: roomtime
description: "RoomTime: video rooms you join by code."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  flutter_bloc: ^9.1.1
  go_router: ^17.1.0
  livekit_client: ^2.13.2
  get_it: ^9.3.0
  injectable: ^2.7.1+4
  collection: ^1.19.1
  flutter_secure_storage: ^10.3.4
  permission_handler: ^12.0.1
  dio: ^5.11.1
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^2.12.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.5
  json_serializable: ^6.15.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/

  # Inter 4.1 (SIL OFL 1.1, assets/fonts/inter/OFL.txt) is bundled so that no
  # platform, including web, fetches fonts from a third-party CDN.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
        - asset: assets/fonts/inter/InterVariable-Italic.ttf
          style: italic

flutter_launcher_icons:
  image_path: "assets/brand/icon/app-icon-1024.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "assets/brand/icon/android/adaptive-background-432.png"
  adaptive_icon_foreground: "assets/brand/icon/android/adaptive-foreground-432.png"
  adaptive_icon_monochrome: "assets/brand/icon/android/adaptive-monochrome-432.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: false
  macos:
    generate: true
    image_path: "assets/brand/icon/macos/macos-icon-1024.png"
  windows:
    generate: false
